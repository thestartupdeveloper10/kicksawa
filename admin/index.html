<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kicksawa Admin</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Paint the saved theme before React mounts, so dark mode does not flash
      light on load. Same storage key and logic as the storefront.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
          var r = document.documentElement;
          r.classList.toggle('dark', t === 'dark');
          r.setAttribute('data-theme', t);
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
